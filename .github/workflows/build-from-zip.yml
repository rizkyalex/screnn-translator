name: Build APK from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project
        run: |
          curl -sL -o project.zip "https://muse.ai/files/1322350444305363/1085705437843003/kjiyo0opya3c967svxj113nd/android-screen-translator.zip
          ls android-screen-translator
          
      - name: Fix ML Kit dependency
        working-directory: android-screen-translator
        run: |
          sed -i 's|com.google.mlkit:text-recognition:2.0.0|com.google.mlkit:text-recognition:16.0.1|' app/build.gradle.kts
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: android-screen-translator
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-apk
          path: android-screen-translator/app/build/outputs/apk/debug/app-debug.apk
